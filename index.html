<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>台灣小吃盲盒圖鑑：全台美食大百科</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; }
        @keyframes pop {
            0% { transform: scale(0.95); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-pop { animation: pop 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    </style>
</head>
<body class="bg-amber-50/80 text-slate-800 min-h-screen flex flex-col items-center p-4">

    <!-- 主容器 -->
    <div class="w-full max-w-md bg-white rounded-2xl shadow-xl border border-amber-200 overflow-hidden flex flex-col h-[720px]">
        
        <!-- 頂部資訊列 -->
        <div class="bg-gradient-to-r from-amber-600 to-orange-500 p-4 text-white flex justify-between items-center shrink-0">
            <div>
                <h1 class="text-xl font-black tracking-wide">🥢 台灣小吃盲盒圖鑑</h1>
                <p class="text-xs text-amber-100">蒐羅全台經典好味道，挑戰圖鑑全開！</p>
            </div>
            <div class="text-right bg-white/20 backdrop-blur px-3 py-1.5 rounded-xl border border-white/30">
                <span class="text-xs block text-amber-100">現有美食券</span>
                <span id="ticket-count" class="text-lg font-black text-white">3</span> 🎟️
            </div>
        </div>

        <!-- 進度條 -->
        <div class="bg-amber-100/60 px-4 py-2 border-b border-amber-200 flex justify-between items-center text-xs shrink-0">
            <span>圖鑑收集進度：<strong id="progress-text" class="text-amber-700">0 / 24</strong></span>
            <button onclick="claimDaily()" id="daily-btn" class="bg-amber-600 hover:bg-amber-700 text-white font-bold px-2.5 py-1 rounded-lg transition text-xs shadow-sm cursor-pointer">
                每日領取 +2 🎟️
            </button>
        </div>

        <!-- 導覽頁籤 -->
        <div class="grid grid-cols-2 bg-amber-50 border-b border-amber-200 text-center text-xs font-bold shrink-0">
            <button onclick="switchTab('gacha')" id="tab-gacha" class="py-3 text-amber-700 border-b-2 border-amber-600 transition">🎲 開箱盲盒</button>
            <button onclick="switchTab('encyclopedia')" id="tab-encyclopedia" class="py-3 text-slate-500 hover:text-slate-800 transition">📖 美食圖鑑</button>
        </div>

        <!-- 內容區 -->
        <div class="p-5 flex-1 flex flex-col justify-between overflow-hidden">

            <!-- 頁籤一：開箱區 -->
            <div id="section-gacha" class="space-y-4 flex flex-col items-center justify-center h-full">
                <div class="text-center space-y-2">
                    <div class="text-6xl animate-bounce">🥡</div>
                    <h2 class="text-lg font-bold text-slate-800">神秘外帶紙盒</h2>
                    <p class="text-xs text-slate-500">消耗 1 張美食券，隨機解鎖道地台灣美食！</p>
                </div>

                <!-- 抽中卡片展示框 -->
                <div id="result-card" class="hidden w-full bg-gradient-to-br from-amber-50 to-orange-50 border-2 border-amber-300 rounded-2xl p-4 text-center space-y-2.5 animate-pop shadow-md">
                    <div id="res-badge" class="inline-block text-[11px] font-bold px-2.5 py-0.5 rounded-full"></div>
                    <div id="res-emoji" class="text-4xl"></div>
                    <h3 id="res-name" class="text-base font-black text-slate-800"></h3>
                    <p id="res-region" class="text-xs text-amber-700 font-bold"></p>
                    <p id="res-desc" class="text-xs text-slate-600 bg-white/80 p-2.5 rounded-xl border border-amber-200/60 leading-relaxed"></p>
                </div>

                <button onclick="pullSnackGacha()" class="w-full bg-gradient-to-r from-amber-600 to-orange-500 hover:from-amber-500 hover:to-orange-400 text-white font-bold py-3.5 rounded-xl transition shadow-lg shadow-orange-500/25 cursor-pointer">
                    拆開美食盲盒 (消耗 1 🎟️)
                </button>
            </div>

            <!-- 頁籤二：圖鑑庫 -->
            <div id="section-encyclopedia" class="hidden flex-col h-full overflow-hidden">
                <div id="encyclopedia-grid" class="grid grid-cols-2 gap-2.5 overflow-y-auto pr-1 h-full">
                    <!-- JS 動態生成圖鑑項目 -->
                </div>
            </div>

            <!-- 提示訊息 -->
            <div id="toast" class="hidden mt-3 bg-slate-900 text-white text-xs px-3 py-2 rounded-xl text-center shadow-lg transition shrink-0"></div>

        </div>
    </div>

    <script>
        const snacks = [
            { id: 1, name: "珍珠奶茶", emoji: "🧋", region: "全台・台北發祥", rarity: "SSR", desc: "Q彈珍珠配上濃醇奶香，揚名國際的台灣之光！" },
            { id: 2, name: "紅燒牛肉麵", emoji: "🍜", region: "台北・全台經典", rarity: "SSR", desc: "慢火熬燉的濃郁紅燒湯頭，配上軟嫩半筋半肉與酸菜。" },
            { id: 3, name: "鼎泰豐小籠包", emoji: "🥟", region: "台北永康街", rarity: "SSR", desc: "黃金十八摺皮薄餡多，一口咬下湯汁鮮美四溢。" },
            { id: 4, name: "台南肉燥飯", emoji: "🍚", region: "台南府城", rarity: "SR", desc: "肥而不膩的手切肉燥，膠質滿滿的庶民靈魂美食。" },
            { id: 5, name: "士林超大雞排", emoji: "🍗", region: "全台夜市", rarity: "SR", desc: "外皮酥脆卡滋、撒上椒鹽與辣粉的宵夜之王。" },
            { id: 6, name: "蚵仔麵線", emoji: "🍲", region: "萬華・全台小吃", rarity: "SR", desc: "柴魚勾芡羹湯配上鮮甜裹粉蚵仔與大腸。" },
            { id: 7, name: "台式鹹酥雞", emoji: "🧄", region: "全台街角宵夜", rarity: "SR", desc: "炸得金黃酥脆的鹹酥雞，搭配九層塔與蒜片才是王道。" },
            { id: 8, name: "大腸包小腸", emoji: "🌭", region: "逢甲夜市", rarity: "SR", desc: "糯米腸夾著炭烤台式香腸，配上一瓣生大蒜才是真內行。" },
            { id: 9, name: "刈包（虎咬豬）", emoji: "🥙", region: "傳統小吃", rarity: "SR", desc: "軟綿割包夾入滷五花肉、酸菜、香菜與花生粉。" },
            { id: 10, name: "辦桌佛跳牆", emoji: "🏺", region: "台灣喜宴・手路菜", rarity: "SSR", desc: "芋頭、排骨酥、鵪鶉蛋與香菇精燉的豪華辦桌魂。" },
            { id: 11, name: "三杯雞", emoji: "🥘", region: "台灣熱炒經典", rarity: "SR", desc: "麻油、米酒、醬油加上九層塔與薑片大火收汁。" },
            { id: 12, name: "黑芝麻湯圓", emoji: "🍡", region: "冬至・元宵", rarity: "SR", desc: "一口咬下熱騰騰的黑芝麻餡噴湧而出，暖胃又暖心。" },
            { id: 13, name: "古早味蚵仔煎", emoji: "🦪", region: "鹿港・夜市經典", rarity: "R", desc: "煎得恰恰的太白粉漿、鮮甜蚵仔加上特調甜辣醬。" },
            { id: 14, name: "藥燉排骨", emoji: "🥣", region: "饒河夜市", rarity: "R", desc: "十全大補中藥材慢燉排骨，冬天進補第一首選。" },
            { id: 15, name: "豬血糕加花生粉", emoji: "🍢", region: "夜市經典", rarity: "R", desc: "蒸透的豬血糕裹滿香菜與粗粒花生粉。" },
            { id: 16, name: "筒仔米糕", emoji: "🍚", region: "台中・清水", rarity: "R", desc: "筒模蒸熟的糯米飯，淋上肉燥並放上半熟滷蛋或魚鬆。" },
            { id: 17, name: "蔥抓餅加蛋", emoji: "🥠", region: "台北公館・夜市", rarity: "R", desc: "外皮層層酥脆、內裡Q軟的現煎蔥抓餅。" },
            { id: 18, name: "台南棺材板", emoji: "🍞", region: "台南安平", rarity: "R", desc: "厚片吐司酥炸挖空，填入香濃奶香海鮮巧達濃湯。" },
            { id: 19, name: "傳統粉漿蛋餅", emoji: "🍳", region: "台式早餐店", rarity: "N", desc: "厚實軟Q的粉漿餅皮，淋上古早味蒜蓉油膏。" },
            { id: 20, name: "香煎蘿蔔糕", emoji: "🥮", region: "早餐・台式港點", rarity: "N", desc: "煎到兩面金黃赤赤，外酥內軟配顆荷包蛋。" },
            { id: 21, name: "台南古早味豆花", emoji: "🍮", region: "台南・全台甜品", rarity: "N", desc: "口感綿密滑嫩的傳統豆花，淋上糖水與花生仁。" },
            { id: 22, name: "古早味冬瓜檸檬", emoji: "🥤", region: "台南・清涼飲品", rarity: "N", desc: "熬煮冬瓜磚加上鮮榨檸檬汁，酸甜解膩。" },
            { id: 23, name: "雙胞胎與白糖粿", emoji: "🍩", region: "台南古早味點子", rarity: "N", desc: "現炸熱騰騰糯米粿，裹上白糖與花生粉。" },
            { id: 24, name: "瓜仔肉飯", emoji: "🍱", region: "家常古早味", rarity: "N", desc: "醬瓜與豬絞肉拌炒入味，鹹香下飯的古早味。" }
        ];

        let gameState = {
            tickets: 3,
            collected: [],
            lastDailyDate: null
        };

        function loadGame() {
            const saved = localStorage.getItem('taiwan_snack_save');
            if (saved) {
                try { gameState = JSON.parse(saved); } catch(e) {}
            }
            updateUI();
        }

        function saveGame() {
            localStorage.setItem('taiwan_snack_save', JSON.stringify(gameState));
            updateUI();
        }

        function updateUI() {
            document.getElementById('ticket-count').textContent = gameState.tickets;
            document.getElementById('progress-text').textContent = `${gameState.collected.length} / ${snacks.length}`;
            renderEncyclopedia();
        }

        function switchTab(tab) {
            const isGacha = tab === 'gacha';
            document.getElementById('section-gacha').classList.toggle('hidden', !isGacha);
            document.getElementById('section-encyclopedia').classList.toggle('hidden', isGacha);
            document.getElementById('section-encyclopedia').classList.toggle('flex', !isGacha);
            
            document.getElementById('tab-gacha').className = isGacha 
                ? "py-3 text-amber-700 border-b-2 border-amber-600 transition" 
                : "py-3 text-slate-500 hover:text-slate-800 transition";
            document.getElementById('tab-encyclopedia').className = !isGacha 
                ? "py-3 text-amber-700 border-b-2 border-amber-600 transition" 
                : "py-3 text-slate-500 hover:text-slate-800 transition";
        }

        function claimDaily() {
            const today = new Date().toDateString();
            if (gameState.lastDailyDate === today) {
                showToast("今天已經領過美食券囉！明天請再來～");
                return;
            }
            gameState.lastDailyDate = today;
            gameState.tickets += 2;
            saveGame();
            showToast("成功領取 +2 美食券！");
        }

        function pullSnackGacha() {
            if (gameState.tickets < 1) {
                showToast("美食券不足！請點擊「每日領取」或明天再試。");
                return;
            }
            gameState.tickets -= 1;

            const snack = snacks[Math.floor(Math.random() * snacks.length)];
            if (!gameState.collected.includes(snack.id)) {
                gameState.collected.push(snack.id);
            }
            saveGame();

            const cardEl = document.getElementById('result-card');
            cardEl.classList.remove('hidden');

            const badgeEl = document.getElementById('res-badge');
            badgeEl.textContent = `${snack.rarity} 級台灣美食`;
            badgeEl.className = `inline-block text-[11px] font-bold px-2.5 py-0.5 rounded-full ${
                snack.rarity === 'SSR' ? 'bg-amber-500 text-white' :
                snack.rarity === 'SR' ? 'bg-purple-600 text-white' :
                snack.rarity === 'R' ? 'bg-blue-600 text-white' : 'bg-slate-600 text-white'
            }`;

            document.getElementById('res-emoji').textContent = snack.emoji;
            document.getElementById('res-name').textContent = snack.name;
            document.getElementById('res-region').textContent = `📍 ${snack.region}`;
            document.getElementById('res-desc').textContent = snack.desc;

            showToast(`抽到了：${snack.name}！`);
        }

        function renderEncyclopedia() {
            const grid = document.getElementById('encyclopedia-grid');
            grid.innerHTML = snacks.map(snack => {
                const isCollected = gameState.collected.includes(snack.id);
                return `
                    <div class="border rounded-xl p-2.5 flex flex-col justify-between text-xs ${
                        isCollected 
                            ? 'bg-amber-50/70 border-amber-300' 
                            : 'bg-slate-100 border-slate-200 text-slate-400'
                    }">
                        <div class="flex justify-between items-start">
                            <span class="text-xl">${isCollected ? snack.emoji : '❓'}</span>
                            <span class="text-[9px] font-bold px-1.5 py-0.5 rounded ${
                                snack.rarity === 'SSR' ? 'bg-amber-500 text-white' :
                                snack.rarity === 'SR' ? 'bg-purple-600 text-white' :
                                snack.rarity === 'R' ? 'bg-blue-600 text-white' : 'bg-slate-500 text-white'
                            }">${snack.rarity}</span>
                        </div>
                        <div class="mt-1.5">
                            <p class="font-bold text-slate-800 text-[11px]">${isCollected ? snack.name : '未解鎖小吃'}</p>
                            <p class="text-[9px] text-slate-500 mt-0.5 truncate">${isCollected ? snack.region : '???抽獎解鎖'}</p>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.remove('hidden');
            setTimeout(() => toast.classList.add('hidden'), 3000);
        }

        loadGame();
    </script>
</body>
</html>
